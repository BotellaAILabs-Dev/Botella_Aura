# =============================================================================
# Netlify configuration — Botella Aura
# Next.js 14 (App Router) + Prisma + NextAuth — a SERVER-RENDERED app.
# =============================================================================
#
# ⚠️  WHY THERE IS NO "/* -> /index.html" REDIRECT HERE
#
# The classic "404 on refresh" fix is a SPA catch-all redirect. That is for
# static single-page apps and would BREAK this app. Botella Aura is
# server-rendered: the Netlify Next.js Runtime turns every route (pages, dynamic
# routes like /dashboard/content/[id], API routes, and middleware) into
# serverless/edge functions. Because the server handles every request, a hard
# refresh on any deep link already works — no redirect rule needed.
#
# Do NOT set `publish` to "out" and do NOT add `output: 'export'` to
# next.config.mjs. Either one turns this into a static export, which drops the
# API routes/auth/database and reintroduces refresh 404s on dynamic routes.
# =============================================================================

[build]
  # Applies pending DB migrations, generates the Prisma client, then builds.
  command = "pnpm run netlify:build"
  # The Next.js runtime consumes .next and produces the functions itself.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Netlify's secrets scanner flags ANY env value that also appears in the
  # repo or build output. These are not secrets — public API base URLs, model
  # names, the site's own address — and they legitimately appear in the code
  # as defaults and in .env.example. Real secrets (API keys, DATABASE_URL,
  # NEXTAUTH_SECRET, ENCRYPTION_KEY, CRON_SECRET) are NOT listed: still scanned.
  SECRETS_SCAN_OMIT_KEYS = "HUGGINGFACE_API_BASE,HUGGINGFACE_MODEL_ID,AGNES_API_BASE_URL,AGNES_IMAGE_MODEL,GOOGLE_IMAGE_MODEL,GEMINI_MODEL,REDDIT_USER_AGENT,NEXTAUTH_URL,APP_URL"
  # NOTE: do NOT set PRISMA_CLI_BINARY_TARGETS here. It *overrides* the schema's
  # binaryTargets and does not accept the "native" keyword, which fails the
  # build with: "Unknown binaryTarget native". The Lambda engine target is
  # declared in prisma/schema.prisma (`binaryTargets`) instead — that is the
  # supported way and it understands "native".

# The official runtime: handles SSR, API routes, middleware, ISR, and images.
# Netlify installs this automatically; declaring it makes the setup explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- Caching ----------------------------------------------------------------
# Next fingerprints these filenames, so they're safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Baseline security headers ----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- `netlify dev` ----------------------------------------------------------
[dev]
  command = "pnpm dev"
  targetPort = 3000
  framework = "#custom"
