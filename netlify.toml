# =============================================================================
# Netlify configuration — Botella Aura
# Next.js 14 (App Router) + Prisma + NextAuth — a SERVER-RENDERED app.
# =============================================================================
#
# ⚠️  WHY THERE IS NO "/* -> /index.html" REDIRECT HERE
#
# The classic "404 on refresh" fix is a SPA catch-all redirect. That is for
# static single-page apps and would BREAK this app. Botella Aura is
# server-rendered: the Netlify Next.js Runtime turns every route (pages, dynamic
# routes like /dashboard/content/[id], API routes, and middleware) into
# serverless/edge functions. Because the server handles every request, a hard
# refresh on any deep link already works — no redirect rule needed.
#
# Do NOT set `publish` to "out" and do NOT add `output: 'export'` to
# next.config.mjs. Either one turns this into a static export, which drops the
# API routes/auth/database and reintroduces refresh 404s on dynamic routes.
# =============================================================================

[build]
  # Applies pending DB migrations, generates the Prisma client, then builds.
  command = "pnpm run netlify:build"
  # The Next.js runtime consumes .next and produces the functions itself.
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  # Netlify Functions run on AWS Lambda (Amazon Linux), not the build image.
  # Prisma must download that engine at build time or queries fail at runtime.
  PRISMA_CLI_BINARY_TARGETS = "native,rhel-openssl-3.0.x"
  NEXT_TELEMETRY_DISABLED = "1"

# The official runtime: handles SSR, API routes, middleware, ISR, and images.
# Netlify installs this automatically; declaring it makes the setup explicit.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# --- Caching ----------------------------------------------------------------
# Next fingerprints these filenames, so they're safe to cache forever.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# --- Baseline security headers ----------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# --- `netlify dev` ----------------------------------------------------------
[dev]
  command = "pnpm dev"
  targetPort = 3000
  framework = "#custom"
